<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf1;--card:#fff;--ink:#14202b;--mute:#5d6b78;--acc:#0b7a75;--onacc:#fff;--track:#d3dce3;--hot:#c2410c;--line:#d9e0e6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#18232f;--ink:#e8eef3;--mute:#8b9aa8;--acc:#4fd1c5;--onacc:#06201e;--track:#2a3846;--hot:#fb923c;--line:#25323f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#18232f;--ink:#e8eef3;--mute:#8b9aa8;--acc:#4fd1c5;--onacc:#06201e;--track:#2a3846;--hot:#fb923c;--line:#25323f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:.2px}
nav{display:flex;background:var(--track);border-radius:999px;padding:3px;width:100%}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;font-size:16px;padding:8px 6px;flex:1;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--card);color:var(--ink)}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:18px;padding:14px 16px 16px;margin-bottom:14px;border:1px solid var(--line)}
.top{display:flex;gap:8px;align-items:center}
.name{flex:1;min-width:0;border:0;background:none;color:var(--mute);font:inherit;font-size:17px;padding:6px 0}
.name::placeholder{color:var(--mute);opacity:.7}
.x{border:0;background:none;color:var(--mute);font-size:28px;line-height:1;width:40px;height:40px;border-radius:50%;cursor:pointer}
.x:hover{background:var(--track);color:var(--ink)}
.time{display:flex;align-items:center;justify-content:center;padding:6px 0 12px;font-size:76px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px}
.disp{min-height:1em}
.num{width:1.45em;border:0;background:var(--bg);color:var(--ink);font:inherit;font-size:inherit;text-align:center;border-radius:12px;padding:6px 0;-moz-appearance:textfield}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sep{color:var(--mute);padding:0 3px}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px}
.ctl{display:flex;gap:10px}
.go,.ghost{flex:1;font-size:19px;font-weight:600;padding:13px;border-radius:14px;border:0;cursor:pointer}
.go{background:var(--acc);color:var(--onacc)}
.ghost{background:var(--track);color:var(--ink)}
.ghost:disabled,.go:disabled{opacity:.4;cursor:default}
.card.done .disp{color:var(--hot);animation:fl .7s steps(1) infinite}
.card.done .bar i{background:var(--hot)}
@keyframes fl{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.card.done .disp{animation:none}}
.add{width:100%;padding:15px;border-radius:16px;border:2px dashed var(--mute);background:none;color:var(--ink);font-size:18px;font-weight:600;cursor:pointer}
.add:hover{border-color:var(--acc);color:var(--acc)}
.sw{text-align:center;font-size:84px;font-weight:600;font-variant-numeric:tabular-nums;padding:26px 0 18px;line-height:1}
.sw small{font-size:.5em;color:var(--mute)}
ol{list-style:none;margin:16px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-top:1px solid var(--line);font-size:18px;font-variant-numeric:tabular-nums}
li span{color:var(--mute);flex:1}
li span:last-child{text-align:right}
li b{flex:1;text-align:center;font-weight:600}
li.best b{color:var(--acc)}
li.worst b{color:var(--hot)}
.empty{color:var(--mute);text-align:center;margin:20px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:17px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.desc{margin:2px 0 8px;color:var(--mute);font-size:17px;line-height:1.35}
.fld{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:19px}
.fld input{width:84px;font:inherit;font-size:22px;text-align:center;border:0;background:var(--bg);color:var(--ink);border-radius:12px;padding:7px}
.fld span:last-child{color:var(--mute)}
.wgo{width:100%;margin-top:12px}
.wp{border:3px solid var(--line);border-radius:18px;padding:18px 14px;text-align:center;background:var(--card);margin-bottom:14px}
.wp.work{border-color:var(--acc)}.wp.rest{border-color:var(--hot)}.wp.prep{border-color:var(--mute)}
.wl{font-size:30px;font-weight:700}
.wr{color:var(--mute);font-size:18px;margin:2px 0}
.wt{font-size:104px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.wp.rest .wt{color:var(--hot)}.wp.work .wt{color:var(--acc)}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:20px}
.cnt .ghost,.cnt .go{flex:none;padding:12px 18px}
.cnt b{font-size:34px}
@media (max-width:420px){.wt{font-size:84px}}
.lbl{font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:6px 2px}
.chip.pre{font-size:15px;font-weight:500;padding:8px 13px}
.mc{flex:none;display:flex;border:1px solid var(--acc);border-radius:999px;background:var(--card);overflow:hidden}
.mc button{border:0;background:none;color:var(--ink);padding:8px 12px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.mc button:last-child{color:var(--mute);padding-left:2px}
.stp{display:flex;align-items:center;gap:6px}
.sb{border:0;background:var(--track);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:none;padding:0}
.sb:disabled{opacity:.35}
.fld input.wf{width:96px}
.stepr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.stepr input{font:inherit;font-size:18px;border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:8px;text-align:center}
.stepr .nm{flex:1 1 130px;text-align:left;min-width:0}
.stepr .tm{width:78px}.stepr .rp{width:48px}
.mul{color:var(--mute)}
.kd{border:0;border-radius:10px;padding:8px 10px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--acc);color:var(--onacc)}
.kd.rest{background:var(--hot)}
.sv{display:flex;gap:8px;margin-top:12px}
.sv input{flex:1;min-width:0;font:inherit;font-size:17px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px}
.sv .ghost{flex:none;padding:10px 16px;font-size:17px}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:16px;font-weight:600;padding:8px 6px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:18px}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}
.srow small{display:block;color:var(--mute);font-size:14px}
.srow .chips{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.tgl{flex:none;width:52px;height:30px;border-radius:99px;border:0;background:var(--track);position:relative;cursor:pointer;padding:0}
.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:transform .15s}
.tgl[aria-checked="true"]{background:var(--acc)}
.tgl[aria-checked="true"] i{transform:translateX(22px)}
.sw8{display:flex;gap:12px;flex-wrap:wrap}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.dot[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
input[type=range]{width:100%;accent-color:var(--acc)}
#vx h2{margin:0 0 12px;font-size:22px}
#gear{font-size:20px}
[hidden]{display:none!important}
@media (max-width:420px){.time{font-size:60px}.sw{font-size:64px}}
</style>
</head>
<body>
<main>
<header>
<h1>Timer Plus</h1>
<button class="sb" id="gear" aria-label="Ajustes" title="Ajustes">⚙</button>
<nav role="tablist" aria-label="Modo">
<button role="tab" data-tab="t">Temporizador</button>
<button role="tab" data-tab="s">Cronómetro</button>
<button role="tab" data-tab="w">Entrenar</button>
</nav>
</header>
<section id="vt"><div id="list"></div><button class="add" id="add">Añadir temporizador</button></section>
<section id="vs" hidden>
<div class="card">
<div class="sw" id="swd" aria-live="off"></div>
<div class="ctl">
<button class="ghost" id="swrst">Reiniciar</button>
<button class="go" id="swgo">Iniciar</button>
<button class="ghost" id="swlap">Vuelta</button>
</div>
<div id="laps"></div>
</div>
</section>
<section id="vw" hidden></section>
<section id="vx" hidden></section>
</main>
<script>
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&"<>]/g,c=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[c]));
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mk=()=>({id:uid(),name:'',dur:300000,rem:300000,end:null,state:'idle'});
let S={tab:'t',timers:[],sw:{acc:0,start:null,laps:[]},wk:{type:'tabata',cfg:{}}};
try{const r=localStorage.getItem('timerplus1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('timerplus1',JSON.stringify(S))}catch(e){}};
const now0=Date.now();
S.timers.forEach(t=>{if(t.state==='run'&&t.end<=now0){t.state='done';t.rem=0;t.ack=true}});
if(!S.timers.length)S.timers.push(mk());

/* Ajustes */
const DEF={theme:'system',acc:'teal',snd:'beep',vol:70,rep:12,vib:true,not:true,wake:true,cd:3,ms:true};
S.set=Object.assign({},DEF,S.set);
const ACC={teal:['Turquesa','#0b7a75','#4fd1c5','#fff','#06201e'],blue:['Azul','#1d5fd1','#6ea8ff','#fff','#07142e'],violet:['Violeta','#6d3fd1','#b79cff','#fff','#1a0b3d'],rose:['Rosa','#c0265a','#ff8fb4','#fff','#3d0719'],green:['Verde','#2f7d32','#7fd983','#fff','#08240a']};
const SND={beep:['Pitido','sine',880],digital:['Digital','square',1100],campana:['Campana','bell',660],suave:['Suave','triangle',523],alarma:['Sirena','sawtooth',700],none:['Silencio']};
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const r=document.documentElement,m=S.set.theme;if(m==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',m);
const dk=m==='dark'||(m==='system'&&mq.matches),a=ACC[S.set.acc]||ACC.teal;r.style.setProperty('--acc',dk?a[2]:a[1]);r.style.setProperty('--onacc',dk?a[4]:a[3])}
if(mq.addEventListener)mq.addEventListener('change',applyTheme);
applyTheme();
const vib=()=>{try{S.set.vib&&navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}};

/* Audio, notifications */
let ac,ringT=null,ringN=0;
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function blip(f,d,w,x){if(!ac||S.set.snd==='none')return;const t0=ac.currentTime+(x||0),v=S.set.vol/100*(/square|sawtooth/.test(w)?.22:.5),bell=w==='bell';
const mk=(fr,vv,dd)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=bell?'sine':w;o.frequency.setValueAtTime(fr,t0);if(w==='sawtooth')o.frequency.linearRampToValueAtTime(fr*1.4,t0+dd);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vv),t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dd);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dd+.03)};
if(bell){mk(f,v,d*4);mk(f*2.76,v*.4,d*2)}else mk(f,v,d)}
function beep3(){const k=SND[S.set.snd];if(!k||!k[1])return;[0,.25,.5].forEach(x=>blip(k[2],.2,k[1],x))}
const pending=()=>S.timers.some(t=>t.state==='done'&&!t.ack);
function stopRing(){clearInterval(ringT);ringT=null}
function startRing(){if(ringT)return;ringN=0;beep3();ringT=setInterval(()=>{if(++ringN>=S.set.rep||!pending())stopRing();else beep3()},1500)}
function askNotif(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
function finish(t){startRing();vib();
try{if(S.set.not&&'Notification' in window&&Notification.permission==='granted')new Notification('Timer Plus',{body:(t.name||'Temporizador')+': tiempo terminado'})}catch(e){}}

/* Timers */
const fmt=ms=>{const s=Math.ceil(ms/1000);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
function card(t){
const idle=t.state==='idle',s=Math.round(t.dur/1000);
const label={idle:'Iniciar',run:'Pausar',pause:'Continuar',done:'Repetir'}[t.state];
const time=idle
?`<input class="num" data-k="h" inputmode="numeric" aria-label="Horas" value="${p2(Math.floor(s/3600))}"><span class="sep">:</span><input class="num" data-k="m" inputmode="numeric" aria-label="Minutos" value="${p2(Math.floor(s%3600/60))}"><span class="sep">:</span><input class="num" data-k="s" inputmode="numeric" aria-label="Segundos" value="${p2(s%60)}">`
:`<div class="disp">${fmt(t.rem)}</div>`;
return `<article class="card ${t.state}" data-id="${t.id}"><div class="top"><input class="name" placeholder="Nombre del temporizador" aria-label="Nombre" value="${esc(t.name)}"><button class="x" data-a="del" aria-label="Eliminar temporizador">×</button></div><div class="time">${time}</div><div class="bar"><i style="width:${idle?0:t.dur?(1-t.rem/t.dur)*100:100}%"></i></div><div class="ctl"><button class="ghost" data-a="reset"${idle?' disabled':''}>Reiniciar</button><button class="go" data-a="play">${label}</button></div></article>`}
function render(){$('#list').innerHTML=S.timers.map(card).join('');
document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
$('#vt').hidden=S.tab!=='t';$('#vs').hidden=S.tab!=='s';$('#vw').hidden=S.tab!=='w';swRender();wRender();$('#vx').hidden=S.tab!=='x';sRender()}
function act(t,a){const now=Date.now();
if(a==='del')S.timers=S.timers.filter(x=>x!==t);
else if(a==='reset'){t.state='idle';t.rem=t.dur;t.end=null}
else if(a==='play'){unlock();askNotif();
if(t.state==='run'){t.rem=t.end-now;t.state='pause'}
else{if(t.state==='done'||t.state==='idle'){if(!t.dur)return;t.rem=t.dur}t.end=now+t.rem;t.state='run'}}
save();render()}
const find=e=>{const c=e.target.closest('.card');return c&&S.timers.find(x=>x.id===c.dataset.id)};
$('#list').addEventListener('click',e=>{const t=find(e);if(!t)return;t.ack=true;const b=e.target.closest('[data-a]');if(b)act(t,b.dataset.a)});
$('#list').addEventListener('input',e=>{if(e.target.classList.contains('name')){const t=find(e);if(t){t.name=e.target.value;save()}}});
$('#list').addEventListener('change',e=>{if(!e.target.classList.contains('num'))return;const t=find(e),c=e.target.closest('.card');
const g=k=>Math.min(k==='h'?99:59,Math.max(0,parseInt(c.querySelector(`[data-k="${k}"]`).value,10)||0));
t.dur=(g('h')*3600+g('m')*60+g('s'))*1000;t.rem=t.dur;save();render()});
$('#list').addEventListener('focusin',e=>{if(e.target.classList.contains('num'))e.target.select()});
$('#add').onclick=()=>{S.timers.push(mk());save();render();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};

/* Stopwatch */
const elapsed=()=>S.sw.acc+(S.sw.start?Date.now()-S.sw.start:0);
const lapTxt=ms=>p2(Math.floor(ms/60000))+':'+p2(Math.floor(ms/1000)%60)+'.'+String(ms%1000).padStart(3,'0');
function swShow(){const ms=Math.floor(elapsed());$('#swd').innerHTML=p2(Math.floor(ms/60000))+':'+p2(Math.floor(ms/1000)%60)+(S.set.ms?'<small>.'+String(ms%1000).padStart(3,'0')+'</small>':'')}
function swRender(){const w=S.sw,run=!!w.start;swShow();
$('#swgo').textContent=run?'Pausar':(w.acc?'Continuar':'Iniciar');
$('#swlap').disabled=!run;$('#swrst').disabled=run||!w.acc;
const L=w.laps;if(!L.length){$('#laps').innerHTML='<p class="empty">Pulsa Vuelta con el cronómetro en marcha para registrar tiempos parciales.</p>';return}
const d=L.map((x,i)=>x-(L[i-1]||0)),mx=Math.max(...d),mn=Math.min(...d);
$('#laps').innerHTML='<ol>'+L.map((x,i)=>`<li class="${L.length>2?(d[i]===mn?'best':d[i]===mx?'worst':''):''}"><span>Vuelta ${i+1}</span><b>${lapTxt(d[i])}</b><span>${lapTxt(x)}</span></li>`).reverse().join('')+'</ol>'}
$('#swgo').onclick=()=>{const w=S.sw;if(w.start){w.acc+=Date.now()-w.start;w.start=null}else w.start=Date.now();save();swRender()};
$('#swlap').onclick=()=>{if(S.sw.start){S.sw.laps.push(Math.floor(elapsed()));save();swRender()}};
$('#swrst').onclick=()=>{S.sw={acc:0,start:null,laps:[]};save();swRender()};

/* Entrenamientos */
const FL={prep:['Preparación','t'],work:['Trabajo','t'],rest:['Descanso','t'],rounds:['Rondas','n'],stations:['Estaciones','n'],rr:['Descanso de ronda','t'],capS:['Duración','t']};
const SP={work:'Trabajo',rest:'Descanso'};
const sp=(l,k,s,n)=>({l,k,s,n:n||1});
const TY={
tabata:{n:'Tabata',d:'Intervalos cortos y muy intensos de trabajo y descanso.',v:{prep:10,work:20,rest:10,rounds:8}},
emom:{n:'EMOM',d:'Every Minute On the Minute: haces tu tarea al empezar cada intervalo y descansas lo que sobre.',v:{prep:10,work:60,rounds:10}},
amrap:{n:'AMRAP',d:'As Many Rounds As Possible: tantas rondas como puedas en el tiempo marcado. Suma rondas con el botón.',v:{prep:10,capS:600}},
afap:{n:'AFAP',d:'As Fast As Possible (por tiempo): el reloj cuenta hacia arriba hasta que termines. Límite opcional.',v:{prep:10,capS:0}},
hiit:{n:'HIIT',d:'Intervalos de alta intensidad con trabajo, descanso y rondas a tu medida.',v:{prep:10,work:40,rest:20,rounds:10}},
circuit:{n:'Circuito',d:'Varias estaciones seguidas, con descanso entre estaciones y entre rondas.',v:{prep:10,work:40,rest:20,stations:6,rounds:3,rr:60}},
boxing:{n:'Boxeo',d:'Asaltos largos con descanso corto entre ellos, como en el ring.',v:{prep:10,work:180,rest:60,rounds:6}},
custom:{n:'Personalizado',d:'Crea tu propia secuencia: cada paso tiene nombre, tipo, tiempo y repeticiones. La secuencia se repite las veces que indiques.',v:{prep:10,rounds:1,steps:[sp('Trabajo','work',30),sp('Descanso','rest',15)]}}};
const PRE=[
['Tabata clásico','tabata',{work:20,rest:10,rounds:8}],['Tabata doble','tabata',{work:20,rest:10,rounds:16}],['Tabata suave 30/30','tabata',{work:30,rest:30,rounds:8}],
['EMOM 10','emom',{work:60,rounds:10}],['EMOM 20','emom',{work:60,rounds:20}],['E2MOM 20','emom',{work:120,rounds:10}],['E30S 10','emom',{work:30,rounds:20}],
['AMRAP 7','amrap',{capS:420}],['AMRAP 12','amrap',{capS:720}],['AMRAP 20','amrap',{capS:1200}],
['Sin límite','afap',{capS:0}],['Límite 15 min','afap',{capS:900}],['Límite 30 min','afap',{capS:1800}],
['HIIT 30/30','hiit',{work:30,rest:30,rounds:10}],['HIIT 40/20','hiit',{work:40,rest:20,rounds:10}],['HIIT 45/15','hiit',{work:45,rest:15,rounds:12}],['Sprints 20/40','hiit',{work:20,rest:40,rounds:8}],
['6 estaciones 40/20','circuit',{work:40,rest:20,stations:6,rounds:3,rr:60}],['8 estaciones 30/15','circuit',{work:30,rest:15,stations:8,rounds:2,rr:60}],['Exprés 4×45/15','circuit',{work:45,rest:15,stations:4,rounds:4,rr:45}],
['Amateur 3×3','boxing',{work:180,rest:60,rounds:3}],['Boxeo 6×3','boxing',{work:180,rest:60,rounds:6}],['Pro 12×3','boxing',{work:180,rest:60,rounds:12}],['Muay Thai 5×3','boxing',{work:180,rest:120,rounds:5}],
['Calentamiento 5 min','custom',{rounds:1,steps:[sp('Trote suave','work',120),sp('Movilidad','work',90),sp('Activación','work',60),sp('Descanso','rest',30)]}],
['Pirámide','custom',{rounds:1,steps:[sp('Trabajo','work',30),sp('Descanso','rest',15),sp('Trabajo','work',60),sp('Descanso','rest',30),sp('Trabajo','work',90),sp('Descanso','rest',45),sp('Trabajo','work',60),sp('Descanso','rest',30),sp('Trabajo','work',30)]}],
['Escalera 1-2-3-2-1','custom',{rounds:1,steps:[sp('Trabajo','work',60),sp('Descanso','rest',30),sp('Trabajo','work',120),sp('Descanso','rest',60),sp('Trabajo','work',180),sp('Descanso','rest',90),sp('Trabajo','work',120),sp('Descanso','rest',60),sp('Trabajo','work',60)]}],
['Estiramientos 6×30 s','custom',{rounds:1,steps:[sp('Estiramiento','work',30,6)]}]];
S.wk.mine=S.wk.mine||[];S.wk.cfg=S.wk.cfg||{};
const clone=o=>JSON.parse(JSON.stringify(o));
const lab=(t,k)=>t==='emom'&&k==='work'?'Cada intervalo':t==='emom'&&k==='rounds'?'Intervalos':t==='afap'&&k==='capS'?'Límite (0 = sin límite)':t==='boxing'&&k==='work'?'Asalto':t==='boxing'&&k==='rounds'?'Asaltos':t==='custom'&&k==='rounds'?'Repeticiones de la secuencia':FL[k][0];
const wcfg=t=>clone(Object.assign({},TY[t].v,S.wk.cfg[t]));
const pt=s=>{const a=String(s).trim().split(':').map(x=>parseInt(x,10)||0);return a.length===1?a[0]:a.length===2?a[0]*60+a[1]:a[0]*3600+a[1]*60+a[2]};
const ft=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+p2(m):p2(m))+':'+p2(s%60)};
const mmss=(ms,f)=>{const s=f?Math.floor(ms/1000):Math.ceil(ms/1000);return p2(Math.floor(s/60))+':'+p2(s%60)};
const clamp=(t,k,v)=>{const mn=(k==='rounds'||k==='stations'||k==='work'||(k==='capS'&&t==='amrap'))?1:0;return Math.max(mn,Math.min(FL[k][1]==='t'?86400:999,v))};
function setc(fn){const t=S.wk.type,c=wcfg(t);fn(c,t);S.wk.cfg[t]=c;save();return c}
let W={st:'idle'},wl;
async function lock(on){try{if(on&&S.set.wake&&'wakeLock' in navigator)wl=await navigator.wakeLock.request('screen');else if(wl){wl.release();wl=null}}catch(e){}}
function tone(f,d){const k=SND[S.set.snd];if(!k||!k[1])return;blip(k[2]*(f>800?1.25:1),d,k[1])}
function build(t,c){const P=[],a=(l,k,s,r,R)=>P.push({l,k,ms:s*1000,r,R});
if(c.prep)a('Preparados','prep',c.prep);
if(t==='emom')for(let i=1;i<=c.rounds;i++)a('Intervalo '+i,'work',c.work,i,c.rounds);
else if(t==='amrap')a('AMRAP','work',c.capS);
else if(t==='afap')P.push({l:'Por tiempo',k:'work',ms:c.capS*1000,up:true});
else if(t==='custom')for(let r=1;r<=c.rounds;r++)c.steps.forEach(s=>{const n=Math.max(1,s.n);for(let i=1;i<=n;i++)a((s.l||SP[s.k])+(n>1?' '+i+'/'+n:''),s.k,s.s,r,c.rounds)});
else if(t==='circuit')for(let r=1;r<=c.rounds;r++){for(let s=1;s<=c.stations;s++){a('Estación '+s+' de '+c.stations,'work',c.work,r,c.rounds);if(s<c.stations&&c.rest)a('Descanso','rest',c.rest,r,c.rounds)}if(r<c.rounds&&c.rr)a('Descanso de ronda','rest',c.rr,r,c.rounds)}
else for(let r=1;r<=c.rounds;r++){a(t==='boxing'?'Asalto':'Trabajo','work',c.work,r,c.rounds);if(r<c.rounds&&c.rest)a('Descanso','rest',c.rest,r,c.rounds)}
return P.filter(x=>x.up||x.ms>0)}
const durTxt=(t,c)=>{const P=build(t,c);return P.some(x=>x.up&&!x.ms)?'Sin límite':mmss(P.reduce((a,x)=>a+x.ms,0))};
function wEnter(i){W.i=i;W.lb=null;const ph=W.P[i];if(ph.up){W.t0=Date.now();W.acc=0}else W.end=Date.now()+ph.ms}
function wStart(){const t=S.wk.type,P=build(t,wcfg(t));if(!P.length)return;unlock();askNotif();
W={st:'run',t,P,i:0,rounds:0,tot:!P.some(x=>x.up),after:P.map((_,i)=>P.slice(i+1).reduce((a,x)=>a+x.ms,0))};wEnter(0);lock(true);tone(1000,.3);wRender()}
function wReset(){W={st:'idle'};lock(false)}
function wDone(el){W.st='done';W.el=el;lock(false);beep3();vib();wRender()}
function wTick(){if(W.st!=='run')return;const ph=W.P[W.i],n=Date.now();let big,frac,tl='';
if(ph.up){const el=W.acc+n-W.t0;if(ph.ms&&el>=ph.ms)return wDone(el);big=mmss(el,true);frac=ph.ms?el/ph.ms:0}
else{const rem=W.end-n;if(rem<=0){if(W.i+1<W.P.length){wEnter(W.i+1);tone(1000,.5);return wRender()}return wDone(W.P.reduce((a,x)=>a+x.ms,0))}
const s=Math.ceil(rem/1000);if(s<=S.set.cd&&s!==W.lb){W.lb=s;tone(700,.12)}big=mmss(rem);frac=1-rem/ph.ms;if(W.tot)tl='Restante total '+mmss(rem+W.after[W.i])}
const t=$('#wt');if(!t)return;t.textContent=big;$('#wb').style.width=frac*100+'%';$('#wtot').textContent=tl}
const fld=(t,k,v)=>{const tm=FL[k][1]==='t';return `<div class="fld"><span>${lab(t,k)}</span><span class="stp"><button class="sb" data-st="-1" data-k="${k}" aria-label="Menos">−</button><input class="wf" data-k="${k}" inputmode="${tm?'text':'numeric'}" value="${tm?ft(v):v}" aria-label="${lab(t,k)}"><button class="sb" data-st="1" data-k="${k}" aria-label="Más">+</button></span></div>`};
const stepRow=(s,i)=>`<div class="stepr" data-i="${i}"><input class="sf nm" data-k="l" value="${esc(s.l)}" placeholder="Nombre del paso" aria-label="Nombre del paso"><button class="kd ${s.k}" data-s="kind" data-i="${i}">${SP[s.k]}</button><input class="sf tm" data-k="s" value="${ft(s.s)}" aria-label="Tiempo del paso"><span class="mul">×</span><input class="sf rp" data-k="n" inputmode="numeric" value="${s.n}" aria-label="Repeticiones del paso"><button class="sb" data-s="up" data-i="${i}" aria-label="Subir paso"${i?'':' disabled'}>↑</button><button class="sb" data-s="del" data-i="${i}" aria-label="Eliminar paso">×</button></div>`;
function wRender(){const el=$('#vw');if(!el)return;const t=S.wk.type,T=TY[t],c=wcfg(t);let h='';
if(W.st==='idle'){
h='<div class="chips" role="group" aria-label="Tipo de entrenamiento">'+Object.keys(TY).map(k=>`<button class="chip" data-ty="${k}" aria-pressed="${k===t}">${TY[k].n}</button>`).join('')+'</div>';
h+='<div class="lbl">Plantillas de '+T.n+'</div><div class="chips">'+PRE.map((p,i)=>p[1]===t?`<button class="chip pre" data-pre="${i}">${p[0]}</button>`:'').join('')+'</div>';
if(S.wk.mine.length)h+='<div class="lbl">Mis plantillas</div><div class="chips">'+S.wk.mine.map(m=>`<span class="mc"><button data-mine="${m.id}">${esc(m.n)}</button><button data-dm="${m.id}" aria-label="Borrar plantilla">×</button></span>`).join('')+'</div>';
h+=`<div class="card"><p class="desc">${T.d}</p>`+Object.keys(T.v).filter(k=>FL[k]).map(k=>fld(t,k,c[k])).join('');
if(t==='custom')h+='<div class="lbl" style="margin-top:12px">Pasos</div>'+c.steps.map(stepRow).join('')+'<button class="ghost wgo" data-s="add">+ Añadir paso</button>';
h+=`<p class="desc">Duración total: <b id="dur">${durTxt(t,c)}</b></p><button class="go wgo" data-w="go">Iniciar entrenamiento</button><div class="sv"><input id="tn" placeholder="Nombre para guardar como plantilla" aria-label="Nombre de la plantilla"><button class="ghost" data-w="save">Guardar</button></div></div>`}
else if(W.st==='done'){
const r=W.t==='afap'?'Tiempo '+mmss(W.el,true)+(W.rounds?' · '+W.rounds+' rondas':''):W.t==='amrap'?W.rounds+' rondas':'Entrenamiento completado';
h=`<div class="wp work"><div class="wl">¡Completado!</div><div class="wt" style="font-size:46px">${r}</div></div><button class="go wgo" data-w="new">Nuevo entrenamiento</button>`}
else{const ph=W.P[W.i],n=Date.now(),run=W.st==='run';
const v=ph.up?(run?W.acc+n-W.t0:W.acc):(run?W.end-n:W.rem);
const cnt=(W.t==='amrap'||W.t==='afap')?`<div class="cnt"><button class="ghost" data-w="-" aria-label="Restar ronda">−</button><div><b>${W.rounds}</b> rondas</div><button class="go" data-w="+">+1 ronda</button></div>`:'';
h=`<div class="wp ${ph.k}"><div class="wl">${ph.l}</div><div class="wr">${ph.R>1?'Ronda '+ph.r+' de '+ph.R:'&nbsp;'}</div><div class="wt" id="wt">${mmss(v,ph.up)}</div><div class="bar"><i id="wb"></i></div><div class="wr" id="wtot"></div>${cnt}</div><div class="ctl"><button class="ghost" data-w="stop">${W.t==='afap'?'Terminar':'Detener'}</button><button class="go" data-w="go">${run?'Pausar':'Continuar'}</button></div>`}
el.innerHTML=h}
$('#vw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,k=d.w,n=Date.now();
if(d.ty){S.wk.type=d.ty;save();return wRender()}
if(d.pre!==undefined){const p=PRE[+d.pre];S.wk.type=p[1];setc(c=>Object.assign(c,clone(p[2])));return wRender()}
if(d.mine){const m=S.wk.mine.find(x=>x.id===d.mine);if(m){S.wk.type=m.t;setc(c=>Object.assign(c,clone(m.c)))}return wRender()}
if(d.dm){S.wk.mine=S.wk.mine.filter(x=>x.id!==d.dm);save();return wRender()}
if(d.st){setc((c,t)=>{const q=d.k;c[q]=clamp(t,q,c[q]+(+d.st)*(q==='capS'?60:FL[q][1]==='t'?5:1))});return wRender()}
if(d.s){setc(c=>{const i=+d.i,L=c.steps;if(d.s==='del'){if(L.length>1)L.splice(i,1)}else if(d.s==='up'){if(i>0)[L[i-1],L[i]]=[L[i],L[i-1]]}else if(d.s==='kind')L[i].k=L[i].k==='work'?'rest':'work';else if(d.s==='add')L.push({l:'',k:'work',s:30,n:1})});return wRender()}
if(k==='save'){const t=S.wk.type,nm=($('#tn').value||'').trim()||TY[t].n+' personalizado';S.wk.mine.push({id:uid(),n:nm,t,c:wcfg(t)});save();return wRender()}
if(k==='go'){if(W.st==='idle')return wStart();const ph=W.P[W.i];
if(W.st==='run'){if(ph.up)W.acc+=n-W.t0;else W.rem=W.end-n;W.st='pause';lock(false)}
else{if(ph.up)W.t0=n;else W.end=n+W.rem;W.st='run';lock(true)}}
else if(k==='stop'){const ph=W.P[W.i];if(ph.up)return wDone(W.st==='run'?W.acc+n-W.t0:W.acc);wReset()}
else if(k==='new')wReset();
else if(k==='+')W.rounds++;
else if(k==='-')W.rounds=Math.max(0,W.rounds-1);
wRender()});
$('#vw').addEventListener('change',e=>{const i=e.target,k=i.dataset.k;let c;
if(i.classList.contains('wf')){c=setc((c,t)=>{c[k]=clamp(t,k,FL[k][1]==='t'?pt(i.value):parseInt(i.value,10)||0)});i.value=FL[k][1]==='t'?ft(c[k]):c[k]}
else if(i.classList.contains('sf')){const x=+i.closest('.stepr').dataset.i;c=setc(c=>{const s=c.steps[x];if(k==='l')s.l=i.value;else if(k==='s')s.s=Math.max(1,Math.min(86400,pt(i.value)));else s.n=Math.max(1,Math.min(99,parseInt(i.value,10)||1))});const s=c.steps[x];if(k==='s')i.value=ft(s.s);else if(k==='n')i.value=s.n}
else return;
const dr=$('#dur');if(dr)dr.textContent=durTxt(S.wk.type,c)});
$('#vw').addEventListener('focusin',e=>{if(e.target.matches('.wf,.tm,.rp'))e.target.select()});

/* Panel de ajustes */
let cf='';
function sRender(){const el=$('#vx');if(!el)return;const s=S.set;
const seg=(k,o)=>'<div class="seg" role="group">'+o.map(x=>`<button data-sk="${k}" data-sv="${x[0]}" aria-pressed="${String(s[k])===String(x[0])}">${x[1]}</button>`).join('')+'</div>';
const tg=(k,l,d)=>`<div class="srow"><div><div>${l}</div>${d?`<small>${d}</small>`:''}</div><button class="tgl" role="switch" aria-checked="${s[k]}" data-tg="${k}" aria-label="${l}"><i></i></button></div>`;
el.innerHTML=`<h2>Ajustes</h2>
<div class="card"><div class="lbl">Apariencia</div>
<div class="srow col"><div>Tema</div>${seg('theme',[['system','Sistema'],['light','Claro'],['dark','Oscuro']])}</div>
<div class="srow col"><div>Color de acento</div><div class="sw8">${Object.keys(ACC).map(k=>`<button class="dot" data-sk="acc" data-sv="${k}" aria-pressed="${s.acc===k}" aria-label="${ACC[k][0]}" style="background:${ACC[k][1]}"></button>`).join('')}</div></div>
${tg('ms','Mostrar milésimas','En el cronómetro')}</div>
<div class="card"><div class="lbl">Sonido</div>
<div class="srow col"><div>Sonido de la alarma</div><div class="chips">${Object.keys(SND).map(k=>`<button class="chip pre" data-sk="snd" data-sv="${k}" aria-pressed="${s.snd===k}">${SND[k][0]}</button>`).join('')}</div></div>
<div class="srow col"><div>Volumen <b id="vv">${s.vol}%</b></div><input type="range" id="vol" min="0" max="100" value="${s.vol}" aria-label="Volumen"></div>
<div class="srow col"><div>Repetir la alarma</div>${seg('rep',[[1,'1 vez'],[4,'4 veces'],[12,'12 veces'],[999,'Sin parar']])}</div>
<div class="srow col"><div>Pitidos de cuenta atrás</div>${seg('cd',[[0,'No'],[3,'3 s'],[5,'5 s'],[10,'10 s']])}</div>
<button class="ghost wgo" data-sa="test">▶ Probar sonido</button></div>
<div class="card"><div class="lbl">Avisos</div>${tg('vib','Vibración','Si tu dispositivo la admite')}${tg('not','Notificaciones','Aviso del navegador al terminar')}${tg('wake','Pantalla siempre encendida','Durante los entrenamientos')}</div>
<div class="card"><div class="lbl">Datos</div><button class="ghost wgo" data-sa="reset">${cf==='reset'?'¿Seguro? Pulsa otra vez':'Restablecer ajustes'}</button><button class="ghost wgo" data-sa="wipe">${cf==='wipe'?'¿Seguro? Se borra todo':'Borrar todos los datos'}</button></div>
<button class="go wgo" data-sa="back">Listo</button>`}
function toggleSet(){if(S.tab==='x')S.tab=S.prev||'t';else{S.prev=S.tab;S.tab='x'}cf='';save();render();scrollTo(0,0)}
$('#gear').onclick=toggleSet;
$('#vx').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.sk){S.set[d.sk]=(d.sk==='rep'||d.sk==='cd')?+d.sv:d.sv;save();applyTheme();if(d.sk==='snd'){unlock();beep3()}cf='';return sRender()}
if(d.tg){S.set[d.tg]=!S.set[d.tg];save();if(d.tg==='not'&&S.set.not)askNotif();cf='';return sRender()}
if(d.sa==='test'){unlock();beep3()}
else if(d.sa==='reset'){if(cf==='reset'){S.set=Object.assign({},DEF);save();applyTheme();cf=''}else cf='reset'}
else if(d.sa==='wipe'){if(cf==='wipe'){try{localStorage.removeItem('timerplus1')}catch(x){}location.reload();return}cf='wipe'}
else if(d.sa==='back')return toggleSet();
sRender()});
$('#vx').addEventListener('input',e=>{if(e.target.id==='vol'){S.set.vol=+e.target.value;$('#vv').textContent=S.set.vol+'%';save()}});
$('#vx').addEventListener('change',e=>{if(e.target.id==='vol'){unlock();beep3()}});

/* Tabs and loop */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render()});
function tick(){const now=Date.now();let ch=false;
S.timers.forEach(t=>{if(t.state==='run'){const r=t.end-now;if(r<=0){t.state='done';t.rem=0;t.ack=false;ch=true;finish(t)}else t.rem=r}
const c=document.querySelector(`[data-id="${t.id}"]`);if(!c)return;
const d=c.querySelector('.disp');if(d&&t.state==='run')d.textContent=fmt(t.rem);
const i=c.querySelector('.bar i');if(i&&t.state==='run')i.style.width=(t.dur?(1-t.rem/t.dur)*100:0)+'%'});
if(ch){save();render()}
if(S.sw.start&&S.tab==='s')swShow();wTick()}
setInterval(tick,50);
render();
</script>
</body>
</html>
